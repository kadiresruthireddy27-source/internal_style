
<!DOCTYPE html>
<html>
<head>
    <title>HTML and CSS</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        h2 {
            color: darkgreen;
        }

        p {
            color: black;
            font-size: 17px;
        }

        img {
            width: 200px;
            height: 120px;
        }
    </style>
</head>

<body>

    <h1>HTML and CSS</h1>

    <h2>HTML</h2>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsubI1xnS2EsbFC7IKOtHXy3o2yp5zNGHX8-mLk-0nVw&s" alt="HTML Image">

    <p>
        <b>HTML</b> stands for HyperText Markup Language.
        It is used to create the <i>structure</i> of a webpage.
    </p>

    <h2>CSS</h2>

    <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/CSS3_logo_and_wordmark.svg/1920px-CSS3_logo_and_wordmark.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail" alt="CSS Image">

    <p>
        <b>CSS</b> stands for Cascading Style Sheets.
        It is used to add <i>style and design</i> to a webpage.
    </p>

    

</body>
</html>
